            - link "〈아크로폴리스, 아테네, 그리스〉, 1991 〈작은 세계(Small World)〉 시리즈 중 하나인 〈아크로폴리스〉는 1991년 마틴 파가 그리스 아테네의 고대 신전을 배경으로 단체 기념사진을 촬영하는 관광객의 모습을 담은 사진입니다. 낯선 해외 관광지에서의 장면임에도 불구하고, 유명 명소 앞에 보여 사진을 남기는 모습은 대표적인 한국 관광객들의 기념사진 촬영 현장과 닮아 우리에게도 익숙하게 느껴집니다. 이처럼 마틴 파는 관광이 전세계적으로 유사한 행동과 풍경을 만들어내는 과정을 유머러스하게 포착했습니다. 사진 속 아주머니 옷에 ‘효(孝)’라는 한자가 보이시나요? 아마도 사진 속 인물들은 효도관광으로 아테네를 ..." [ref=e136] [cursor=pointer]:
