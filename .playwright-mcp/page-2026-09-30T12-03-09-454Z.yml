            - link "〈작은 세계(Small World)〉 〈작은 세계(Small World)〉는 마틴 파가 1980년대부터 전 세계의 관광 현상을 기록한 작업입니다. 작가는 유명 관광지를 찾은 사람들의 모습과 그들이 소비하는 풍경을 포착하며, 현대 관광문화의 이면을 보여줍니다. 서로 다른 문화를 경험하기 위해 떠난 여행은 역설적으로 각 지역의 고유한 특징을 비슷한 방식으로 소비하게 만들고, 결국 전 세계를 하나의 획일적인 관광 공간으로 변화시키기도 합니다. 마틴 파는 이러한 현상을 특유의 유머와 아이러니가 담긴 시선으로 기록했습니다. 사진 속 관광객들은 풍요로운 소비문화를 즐기는 사람들처럼 보이지만, 동시에 끊임없이 새로운..." [ref=e127] [cursor=pointer]:
