            - paragraph [ref=e106]:
              - text: 오늘날 우리가 광고 이미지나 SNS, 관광 스냅사진에서 매일 마주하는 강렬한 색채와 밀착된 시선은 더 이상 낯설지 않습니다. 세계적인 사진가 마틴 파(1952–2025)는 바로 이러한 동시대
              - link "시각문화" [ref=e107] [cursor=pointer]:
                - /url: https://sema.seoul.go.kr/semaaa/front/sissorus/search.do?menuId=18&paramTsId=79
              - text: 의 감각을 수십 년간 집요하게 포착해 왔습니다. 그가 특유의 유머와 관찰력으로 남긴 사진들은 우리의 삶과 문화를 읽어내는 하나의 거대한 풍경이 되어 우리 곁에 숨 쉬고 있습니다. 이러한 작가의 발자취를 기리는
              - strong [ref=e108]: "《마틴 파: We Are Martin Parr》"
              - text: 는 작가 사후 아시아에서 처음 열리는 대규모 회고전입니다. 이번 전시에서는 초기 작업부터 말년에 이르는 14개 시리즈와 500여 점의 작품을 선보이며, 그가 출판한 총 90권의 사진집을 함께 소개합니다. 특히 1990년대 후반부터 2000년대 초반까지 한국을 방문하며 촬영한 남한과 북한 관련 작업 역시 이번 자리에서 함께 만나볼 수 있습니다.
            - paragraph [ref=e109]:
              - text: 세계적인 사진가 그룹 매그넘 포토스(Magnum Photos)*의 작가로 활동한 마틴 파는 지난 수십 년간 현대 사회의 일상과 시각문화를 가장 집요하게 관찰해 온 사진가입니다. 그는 여가와 소비가 이루어지는 전 세계의 관광지와
              - link "스포츠" [ref=e110] [cursor=pointer]:
                - /url: http://sema.seoul.go.kr/kr/knowledge_research/collection/collection_detail?artSeq=WORK_0000004978
              - text: 경기장, 패스트푸드점과 활기 넘치는 거리에서 사람들이 이미지를 통해 스스로를 드러내는 방식을 꾸준히 기록해 왔습니다. 특히 1980년대 이후 확장된 소비문화와 대중관광의 풍경은 그의 작업을 이루는 중요한 배경이 되었습니다. 그의 사진을 단순히 소비사회를 비판하거나 풍자하는 이미지로만 이해하기에는 충분하지 않습니다. 그의 시선은 대상과 거리를 두기보다 오히려 그 세계 가까이로 들어갑니다. 과장된 색채와 밀도 높은 화면, 무심히 지나칠 법한 순간들에 머무는 작가의 시선은 익숙한 일상을 낯설게 바라보게 만듭니다. 이 친근한 세계 속 인물들은 특별한 사건의 주인공이 아닙니다. 선글라스를 끼고 휴가를 즐기는 사람들, 마트의 쇼핑객, 혹은 음식을 먹거나 사진을 찍는 우리 주변의 평범한 이웃들입니다. 마틴 파는 이렇듯 대수롭지 않은 장면 안에서 오늘날 우리가 지닌 욕망과 취향, 소비와 행동 방식을 예리하게 포착해 냅니다. 이미지를 통해 스스로를 꾸미고 기록하며 기억하는 삶의 풍경이 특유의 유머러스한 관찰을 통해 비로소 선명하게 드러나는 것입니다.
            - paragraph [ref=e111]: 오늘날처럼 인공지능이 매끄럽고 균질한 이미지를 빠르게 생산해내는 시대에 그의 사진은 오히려 사진이라는 매체의 물질성과 현장성을 다시 떠올리게 합니다. 그는 정제된 아름다움보다 우연한 순간과 넘쳐나는 일상의 풍경, 어딘가 어색하고 불완전한 장면들에 주목합니다. 그렇기에 그의 사진은 특정 시대를 기록하는 데 머물지 않고, 동시대 시각문화 속에서 우리가 무엇을 보고 어떻게 바라보는지를 다시 질문하게 만듭니다. 이번 전시는 마틴 파가 오랜 세월 고수해 온 ‘솔직하게 정면으로 마주하는 보기의 방식’을 따라가 보고자 합니다. 그의 사진을 특정한 메시지에 가두기보다, 대상과 깊이 동화되어 유쾌하게 번져 나가는 시선 그 자체에 주목합니다. 지나치게 가까운 거리에서 포착된 인물들과 강렬한 색채로 가득한 사물들은 오늘날 우리의 모습과 고스란히 겹쳐집니다. 소비하고 즐기며, 이미지를 통해 끊임없이 자신을 드러내는 존재로서의 우리 말입니다. 그리고 묻습니다. 우리는 그들을 바라보고 있는 것일까요. 아니면 이미 그 장면 안에 함께 서 있는 것일까요.
            - paragraph
