          - generic [ref=f415e290]:
            - paragraph [ref=f415e291]: The METASPEED™ SKY TOKYO shoe is our pinnacle racing product, designed for stride-style runners who are looking to start fast and finish faster. Runners wearing these shoes will be able to increase their speed by lengthening their strides while conserving energy with each step.
            - paragraph [ref=f415e292]: The newly designed FF LEAP™ foam technology is super lightweight and bouncy. It's strategically positioned in the midsole's bottom layer to help provide more cushioning and a higher energy return. The top layer of the midsole implements FF TURBO™ PLUS cushioning. This configuration enhances the foam's responsive properties while creating better stability during the landing phase of your stride.
            - paragraph [ref=f415e293]: Thanks to a higher plate positioning and a thicker midsole thickness through the toe area (when compared to the METASPEED™ EDGE TOKYO shoe), you'll experience a higher energy return and an extended stride length. This property will help you to kick-through the 30km wall and maintain your pace at the later stages of the race.
