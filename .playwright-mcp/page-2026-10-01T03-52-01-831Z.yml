                  - text: system and 3D SPACE CONSTRUCTION™ offer personalized support, stabilizing your feet and improving the efficiency of your gait.
                - listitem [ref=f228e732]: "Breathable and lightweight uppers: We use lightweight upper materials that improve breathability and provide a soft feel."
