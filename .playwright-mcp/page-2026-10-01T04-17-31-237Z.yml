            - paragraph [ref=f445e283]: This shoe is formed with a minimal and lighter carbon plate. It's designed to help propel you forward so you can maintain your pace at the later stages of the race.
            - paragraph [ref=f445e284]: A MATRYX® upper material helps keep the shoe extremely lightweight while keeping your foot secure at fast paces.
            - paragraph [ref=f445e285]: The shoe also implements ASICSGRIP™ technology in the outsole to help provide grip on various surfaces, including wet terrain.
