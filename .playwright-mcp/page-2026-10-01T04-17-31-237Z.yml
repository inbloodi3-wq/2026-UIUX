                        - generic [ref=f445e793]:
                          - generic [ref=f445e794]: Earlier I posted a review under the title “Do Not Buy if you are a heel striker.” I have now found a way to run in these shoes without having to modify my stride to a mid-foot strike. Basically, I don’t run more than 6 miles at a time and I don’t run in them consecutive days. What I enjoy most about these shoes is being able to accelerate up hills. You can really feel the lighter weight on hills. Please note, I still find the initial contact with the ground to be a little too far back on the shoe, and the pavement marks on the sole show that. However, with the trampoline effect of the foam and the wonderful rocker, the shoe quickly transitions to the toe off. Interestingly, I am just as fast in the Tokyo Edge. The heel of the Edge is little more firm and works better for my heel striker stride.
                          - paragraph [ref=f445e809]: Yes, I recommend this product.
