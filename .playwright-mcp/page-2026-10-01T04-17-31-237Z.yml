                        - generic [ref=f445e1129]:
                          - generic [ref=f445e1130]: I have had these for about a year and done about half dozen middle distance (10k to half marathon) events and they are awesome. Like all runners have aches and pains to overcome from time to time. With the intensity of race day one would expect this would be worse. Not so wiht the Metaspeed Ray. Protects AND propels the feet. Fabulous race day shoe. Bonus to boot, it wears well too. If you are passionate about competing, pressing the pace and continuously trying to do your best and get another PR, these are definitively worth the money!
