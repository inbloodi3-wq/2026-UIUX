                        - generic [ref=f445e953]:
                          - generic [ref=f445e954]: The Metaspeed Ray is my favorite running shoe for all types of runs. Most runners will only run in a racing shoe on race day, but I run in Metaspeed Ray (MR) for most of my runs because it is the only shoe that is friendly to my plantar fasciitis (PF). After running the Chicago Marathon in 2026 my PF was so severe that I could not run for several months, followed by end-stage recovery that included only running short distance that did not aggravate the PF as it healed. Over the past few years I have tried many different brands and models of running shoes and have gotten good results from some but not full results until I tried the Metaspeed Ray. During my rehabilitation my physical therapist told me that if I found a shoe that did not aggravate my PF I should stick with it until the PF goes away. After over a year of fighting PF and trying many different shoes, I started wearing MR and almost immediately the PF stopped flaring up and has not returned. If I switched to other brands the PF would threaten again. But not the MR. I even ran the Tokyo Marathon in 2026, wearing Metaspeed Ray (Cobalt), with no recurrence of PF during, after, or since. Now to allow my feet and legs to adapt to different shoe structures, I rotate through a few different shoes, such as Metaspeed Ray, Sky, Edge, and others but when it comes to long-, med-long, or race day runs, I go with MR. I have nine pairs to make sure I have backups as the years go on and the product evolves.
                          - paragraph [ref=f445e969]: Yes, I recommend this product.
