                        - generic [ref=f445e1757]:
                          - generic [ref=f445e1758]: I was apprehensive, wondering whether these shoes might not be for my 57-year-old non-elite self. But they’re great. Any concerns about stability quickly evaporated once I started running at a decent pace (walking in them feels really weird, but they’re not walking shoes, are they?) The upper takes a bit of time to get laced up, but then you forget it’s there, so it’s worth it. The shoes immediately took 10 years off my workout times for 3 and 4-mile threshold runs. Wow. The lightweight, cushioned ride also seems to help speed recovery. I loved the Metaspeed Sky Paris and Tokyo (still using both in rotation), and the Ray feels like a natural progression. I wish the shoes weren’t $300 (yikes), but I’m looking forward to using the Ray for an upcoming 5K race.
