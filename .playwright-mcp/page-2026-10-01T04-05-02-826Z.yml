            - generic [ref=f375e1487]:
              - generic [ref=f375e1490]:
                - heading "About ASICS running shoes for men" [level=2] [ref=f375e1491]
                - paragraph [ref=f375e1492]: Finding the right running shoes for men can make all the difference, helping you stay comfortable and perform your best with every stride. Whether you're new to running or training for your next marathon, navigating the different styles, fits and features can feel overwhelming.
                - paragraph [ref=f375e1493]: At ASICS, we design running shoes with a focus on how the body moves and feels, and how materials and design can evolve to meet the needs of all types of runners. Below are some tips on choosing the running shoes for men depending on your running style, foot type and goals.
                - generic [ref=f375e1494]:
                  - heading "What makes ASICS men’s running shoes so comfortable?" [level=3] [ref=f375e1495]
                  - generic [ref=f375e1497]:
                    - paragraph [ref=f375e1498]:
                      - text: The technologies and innovations developed at the ASICS Institute of Sport Science help make our men’s running sneakers comfortable. For example,
                      - link [ref=f375e1499] [cursor=pointer]:
                        - /url: https://www.asics.com/us/en-us/blog/what-is-asics-gel-technology/
                        - text: GEL
                        - superscript [ref=f375e1500]: ®
                        - text: technology
                      - text: is designed to absorb the shock of every step, while FF BLAST™ technology and FF BLAST™ PLUS technology offer cushioning and boost energy return for a responsive feel. FLYTEFOAM™ technology at the midsole creates softer landings and helps you stay comfortable over longer distances.
                    - paragraph [ref=f375e1501]:
                      - text: Other innovations, such as the TRUSSTIC
                      - superscript [ref=f375e1502]: ®
                      - text: system and engineered mesh uppers, work together to provide adaptive support along with improved fit and breathability.
                - generic [ref=f375e1503]:
                  - heading "How to pick the right running sneakers for men" [level=3] [ref=f375e1504]
                  - paragraph [ref=f375e1507]:
                    - text: Picking the right men’s running shoes and sneakers is a matter of knowing what to look for and what you need. Your running goals, style, typical terrain and habits can help you determine what features make the most sense for you. For example, your choice will likely be different if you’re
                    - link "running on a trail" [ref=f375e1508] [cursor=pointer]:
                      - /url: https://www.asics.com/us/en-us/mens-trail-running-shoes/c/aa10205000/
                    - text: as opposed to running on a track. It can help to take a deep dive into
                    - link "tips for choosing running shoes" [ref=f375e1509] [cursor=pointer]:
                      - /url: https://www.asics.com/us/en-us/blog/how-to-choose-the-best-running-shoes-for-you/
                    - text: and explore all the different factors to consider.
                - heading "What features do ASICS men’s running trainers have?" [level=3] [ref=f375e1510]
                - paragraph [ref=f375e1511]: "ASICS running sneakers for men offer a variety of features based on the style and purpose of the shoe, including:"
                - list [ref=f375e1512]:
                  - listitem [ref=f375e1513]:
                    - text: "Cushioning technologies for comfort: GEL"
                    - superscript [ref=f375e1514]: ®
                    - text: technology, FF BLAST™, FF BLAST™ PLUS and FLYTEFOAM™ cushion your feet over short and long distances.
                  - listitem [ref=f375e1515]:
                    - text: "Stability and support: Our TRUSSTIC"
                    - superscript [ref=f375e1516]: ®
                    - text: system and 3D SPACE CONSTRUCTION™ offer personalized support, stabilizing your feet and improving the efficiency of your gait.
                  - listitem [ref=f375e1517]: "Breathable and lightweight uppers: We use lightweight upper materials that improve breathability and provide a soft feel."
