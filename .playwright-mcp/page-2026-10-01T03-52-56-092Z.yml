                          - generic [ref=f285e1590]: I am 40 y.o. and have lived in NYC for 22 years, mostly without owning a car. I ran way too much in my 30's (6~10 miles every other day), and now my feet are very sensitive. Plantar fascitis, ankle issues, shin splints, I got 'em all. I switched from running to lifting 4 years ago and now I just walk a lot for extra exercise. I have had so much trouble finding the right shoes for this in NYC on the pavement- Endless trouble! I tried switching to barefoot shoes (caused multiple other problems), Lems (now I have capsulitis in my right middle metatarsal too thanks Lems lol), I finally decided to switch back to my trusty Gel Nimbus running shoes for daily walks which have always been pain-free 1st choice for running, but they still felt too squishy for long walks. I walk a LOT sometimes over 20k steps in a day. So I took my old butt down to the Asics store on 14th St., did an old school try on session for a few hours and came away with the GT-15 2000's. After a week of wearing these I could not be happier. EXACTLY what I needed! Basic solid support, wide enough toebox not to feel squished (thank ypu Asics), and no squish. The rebound feels normal, solid, and my feet & lower legs don't get tired. I absolutely love them. Exactly what I was looking for. I'll get a couple more colors and also the GTX for those torrential downpour days we seem to be getting more and more of in the Northeast. So stoked to have found my solution. No pain, no fascitis, no ankle issues- I can walk long & far and feel great the next day. Now my walking doesn't affect my weight lifting, and I'm always ready to go. Seriously thank you Asics for continuing to improve even your most basic models. This really is the very best sports shoe company, in my opinion, Brooks, Bike, Reebok don't even come close! I also tried the Nike Structure and felt like my feet were going to fall off after 3 days. Asics are just designed for your feet, and they still look good too. In the past I thought Asics looked a little goofy but the newer styles are also nicer. My all black GT-15 2000's are actually pretty cool looking and have a nice shape. Probably too long of a review but I am really enjoying the sweet relief of finding something that I can rely on. My shoes are like my car in the city- If they aren't right, I don't feel like going anywhere!
                          - paragraph [ref=f285e1605]: Yes, I recommend this product.
