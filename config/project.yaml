# Project Definition — 현재 진행 중인 프로젝트
# 이 파일이 이 프로젝트의 목표/대상/제약에 대한 Source of Truth다.
# Automation Core(.claude/)는 이 파일의 값을 읽어 동작하며, 프로젝트 고유 규칙을 하드코딩하지 않는다.
# Schema는 config/project-template.yaml과 동일하다.

project:
  id: tj-media-redesign
  name: "TJ미디어 (TJ MEDIA)"
  url: "https://www.tjmedia.com/"   # 2026-09-20 확인(research/current-site-audit.md 부분 실사 근거)
  type: "karaoke-equipment-and-content-service"
  description: "노래방 기기·콘텐츠를 제공하는 기업의 공식 웹사이트. 일반 이용자(B2C)와 노래방 업주/파트너(B2B) 정보가 하나의 사이트에 공존한다."

portfolio:
  purpose: "Claude Code + Figma MCP 자동화 웹 리디자인 포트폴리오 제작"
  deadline_or_scope: "V1(Desktop/Mobile Main+Search Result 4 Final UI, Consistency Audit, Portfolio Case Study, Final Rights Audit)은 2026-09-17 완료. V2(Visual Redesign — Main/Search Result/Latest Songs/Music Chart/Song Detail/Song Request 6 Desktop Core Pages + Main/Search Result/Song Detail 3 Mobile Priority Pages)를 2026-09-20까지 완성한다."

# v1 목표였던 "B2C/B2B 정보구조 분리"는 실제로 B2B 화면이 한 번도 제작되지 않아
# QA-UX-001(output/qa/TJ_MEDIA_QA_AUDIT.md Resolution Log, 2026-09-17, DOWNGRADE 권고)과
# V2 Scope Freeze(output/visual-direction/TJ_MEDIA_VISUAL_DIRECTION_V2.md 1장)에 따라
# 2026-09-17 goals 목록에서 제거했다. 완전히 삭제하지 않고 이 주석과 audiences.b2b-partner에
# 배경 설명으로만 남긴다(project-architecture.md의 "역수정하지 않고 원본 문서를 먼저 수정" 원칙).
goals:
  - "곡 검색 · 최신 반주곡 · 인기차트 · 곡 상세 · 반주곡 신청을 중심으로 핵심 음악 탐색 경험을 재설계하고, Agent 기반 자동화 시스템으로 구현·검수한다"

audiences:
  - id: b2c-user
    name: "일반 노래방 이용자"
    description: "원하는 곡을 빠르게 찾고 신곡/인기곡을 탐색하는 일반 소비자"
    core_tasks:
      - "곡 검색"
      - "신곡/인기곡 탐색"
      - "가사 확인"
  - id: b2b-partner
    name: "노래방 업주 / 비즈니스 파트너"
    description: "기기 도입, 가맹, 매장 운영 관련 정보를 찾는 사업자"
    core_tasks:
      - "제품/서비스 정보 확인"
      - "문의·계약 프로세스 진행"
    v2_note: "V2 Scope Freeze(2026-09-17)에 따라 이 Segment 전용 Core Page는 제작하지 않는다. Header/Footer/Secondary Navigation 수준의 Entry Link로만 존재한다(제품 상세/고객지원 상세/계열회사 등은 V2 명시적 제외 목록)."

primary_user_tasks:
  - "곡 검색"
  - "검색 결과에서 곡 상세 확인"
  - "최신 반주곡 탐색"
  - "인기차트 확인"
  - "곡 저장(My TJ) / YouTube 연결"
  - "반주곡 신청 / 유료곡 등록"

information_architecture:
  segment_separation_required: false
  segment_separation_note: "V1에서는 true였으나, V2 Scope Freeze로 B2B 전용 Core Page가 0건이 되어 2026-09-17 false로 변경. B2B/Common 정보는 Cross-navigation Entry Link 수준으로만 존재하므로 서로 다른 Segment의 '핵심 업무 콘텐츠 혼재' 검사 자체가 적용 대상이 없다(.claude/rules/ux-principles.md 원칙 2)."
  segments:
    - id: c
      label: "B2C / Core"
      description: "V2 Desktop Core Page 6종 + Mobile Priority Page 3종 전체가 이 Segment에 속한다(사실상 단일 Segment)"
    - id: b
      label: "B2B (V1 참고용, V2 비활성)"
      description: "V2에는 전용 화면 없음 — Header/Footer Entry Link로만 존재"
    - id: g
      label: "Common (V1 참고용, V2 축소)"
      description: "회사소개/고객센터 등 상세 페이지는 V2 명시적 제외 대상. 로그인 등 최소 공통 화면만 필요 시 유지 검토"

screen_id_policy:
  prefixes:
    c: "B2C"
    b: "B2B"
    g: "Common"

viewports:
  desktop: 1440
  tablet: null
  mobile: 390

figma:
  file_key: "4IjbcMoAkTyWkoacnVAmNe"
  final_section: "04_Final_UI"
  design_system_section: "03_Design_System"

design_constraints:
  - "Noto Sans KR을 임시 폰트로 사용, 추후 Pretendard로 교체 예정 — Auto Layout/Auto Height 유지 필수"
  - "Brand Cyan(#0EA5BE)은 검색/CTA/Active/Ranking/Spotlight/Data Highlight 등 강조 용도로만 제한적으로 사용(화면 전체 대비 10~20% 이내, 2026-09-18 Direction A 승인 시 상한 15%→20%로 조정)"
  - "Dark Section 허용 범위(V2, 2026-09-17 확정): Main Hero, Music Chart, Section Accent, Case Study Showcase. 비권장: Search Result 전체, Song Request 전체, 모든 Page의 Dark Theme화(design-system/colors.md 참고)"

ux_requirements:
  - "곡 검색 진입점은 핵심 화면 최상단(above the fold)에 노출"
  - "기업/제품 정보는 Header/Footer/Secondary Navigation 수준의 Entry Link로만 노출하고, Core Page 본문에 직접 포함하지 않음(V2 Scope Freeze)"
  - "Mobile은 Desktop의 비율 축소가 아니라 Reflow/Stack/Horizontal Scroll로 재구성"
  - "Search Result는 Neutral/Functional UI를 유지하며 Waveform/Spotlight 등 Graphic Motif를 확산시키지 않는다(V2 Design Rule)"

project_asset_restrictions:
  - "실제 Album Cover"
  - "아티스트/연예인 공식 프로필 사진"
  - "실제 Music Video Still"
  - "영화/드라마 Still"
  - "가사 전문 또는 상당 부분"
  - "타사 광고 이미지"

reference_preferences:
  - "음악 스트리밍/검색 서비스 UI"
  - "Karaoke/Digital Music 서비스 UI"
  - "Reference 이미지 자체는 사용하지 않고 Layout/Hierarchy/Density 등 텍스트 원칙만 추출"

# ================================================================
# V2 (2026-09-17 확정) — 아래 두 블록이 V2의 authoritative Scope/Visual Direction이다.
# 세부 근거/전체 서술은 output/visual-direction/TJ_MEDIA_VISUAL_DIRECTION_V2.md,
# output/visual-direction/TJ_MEDIA_REFERENCE_DIRECTION.md 참고. 여기서는 요약만 유지한다.
# ================================================================
v2_scope:
  target_final_date: "2026-09-20"
  definition: "TJ미디어 전체 기업 사이트 리디자인이 아니라, 곡 검색·최신 반주곡·인기차트·곡 상세·반주곡 신청을 중심으로 핵심 음악 탐색 경험을 재설계하고, Agent 기반 자동화 시스템으로 구현·검수한 프로젝트"
  core_keywords: ["MUSIC SEARCH", "KARAOKE ENERGY", "MUSIC DATA"]
  desktop_core_pages:
    - { screen_id: "c-home", name: "01 Main", status: "V1 Final UI 존재, V2 Visual Redesign 대상" }
    - { screen_id: "c-search-result", name: "02 Search Result", status: "V1 Final UI 존재, V2 Visual Alignment 대상" }
    - { screen_id: "c-latest-songs", name: "03 Latest Songs", status: "신규" }
    - { screen_id: "c-chart", name: "04 Music Chart", status: "신규" }
    - { screen_id: "c-song-detail", name: "05 Song Detail", status: "신규(V1 IA에서는 개념 단계였음, QA-UX-002)" }
    - { screen_id: "c-song-request", name: "06 Song Request / Registration", status: "신규" }
  mobile_priority_pages:
    - { screen_id: "c-home.mobile", name: "01 Main", status: "V1 Final UI 존재" }
    - { screen_id: "c-search-result.mobile", name: "02 Search Result", status: "V1 Final UI 존재" }
    - { screen_id: "c-song-detail.mobile", name: "03 Song Detail", status: "신규" }
  explicitly_excluded:
    - "About TJ MEDIA 별도 페이지"
    - "연혁"
    - "뉴스룸"
    - "CI"
    - "IR"
    - "글로벌"
    - "계열회사"
    - "제품 상세"
    - "음향기기(스피커/앰프/마이크/TV) 상세"
    - "고객지원 상세"
    - "이벤트 상세"
    - "노래방 기기 상세"
  excluded_pages_policy: "기업/제품 정보는 Header/Footer/Secondary Navigation 수준의 Entry Link로만 존재할 수 있다."
  production_stop_rule: "01_Main_Desktop_V2가 Visual QA를 통과하기 전에는 Latest Songs/Music Chart 제작으로 넘어가지 않는다(Main이 V2 Visual System의 Master Screen)."
  deadline_policy: "P2 Page(Mobile Latest/Chart/Request 등) 추가로 2026-09-20 Deadline을 연장하지 않는다."

visual_direction:
  status: "APPROVED"
  approved_at: "2026-09-17"
  reconfirmed_at: "2026-09-18"
  name: "Direction A — Night Stage"
  concept: "무대 조명과 사운드 에너지를 Dark Hero, Cyan Spotlight, Waveform/Equalizer 그래픽으로 표현한다"
  visual_keywords: ["Stage Light", "Spotlight", "Waveform", "Equalizer", "Deep Charcoal", "Cyan Glow", "Music Data", "Energetic but Controlled"]
  main_hero: "Dark Hero"
  primary_accent: "기존 Brand Cyan(#0EA5BE) — 신규 컬러 토큰 생성 없음"
  graphic_motif: ["Waveform", "Equalizer", "Spotlight", "Audio Spectrum"]
  ux_ia_continuity: "V1 UX/IA 구조를 기반으로 유지한다. Visual Layer만 V2에서 발전시킨다."
  v2_primary_goal: "Visual Identity 강화 및 Portfolio 차별화"
  asset_policy: "실제 앨범 커버 및 아티스트 공식 이미지 사용 금지(project_asset_restrictions 유지, 절대 완화하지 않음). 필요한 Artwork는 Self-created 또는 Generated Graphic System(AST-004 Artwork System)으로 해결한다."
  # 2026-09-17에는 "Night Stage 70% / Data Rhythm 30%" 블렌드 + Sound Motion 제외로 기록했으나,
  # 2026-09-18 최종 승인에서 단일 Direction A(Night Stage)로 재확정됐다. Data Rhythm이 강조했던
  # 요소(Large Ranking Number, Song Number, Data Highlight)는 삭제된 것이 아니라 위 visual_keywords의
  # "Music Data"와 section_rhythm_main 규칙 안으로 통합됐다(project-architecture.md의 "역수정하지 않고
  # 원본 문서를 먼저 수정" 원칙에 따라 삭제 대신 이력만 보존한다).
  superseded_note: "2026-09-17 기록: final_blend='Night Stage 70% / Data Rhythm 30%', excluded_direction='Sound Motion'. 2026-09-18 Direction A 단일 승인으로 대체됨."
  page_visual_roles:
    main: "Brand Impact + Search Entry"
    latest_songs: "Artwork + Discovery"
    chart: "Ranking + Music Data"
    search_result: "Neutral + Functional"
    song_detail: "Artwork + Information + Action"
    song_request: "Functional Form UX"
  section_rhythm_main: "Dark Hero → White Latest Songs → Dark Music Chart → White Service/Content Section"
  reference_source: "output/visual-direction/TJ_MEDIA_REFERENCE_DIRECTION.md (8건, references/reference-index.jsonl)"
  full_detail_source: "output/visual-direction/TJ_MEDIA_VISUAL_DIRECTION_V2.md"

status: in_progress
