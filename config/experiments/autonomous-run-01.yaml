# 사용자가 AUTORUN_01을 지정한 작업에서만 활성 Config로 사용한다(CLAUDE.md "시작할 때 항상 먼저 한다").
# 비어 있는 값은 아직 정해지지 않은 것이며 Agent가 추정해 채우지 않는다(Level 3).

project:
  id: "AUTORUN_01"            # 사용자 지정 ID(템플릿의 kebab-case 권장과 다름 — 사용자 요구 우선). 파일/디렉터리명은 autonomous-run-01
