  target_service: "서울시립미술관 SeMA (Seoul Museum of Art)"
  industry: "Culture / Exhibition / Experience Discovery"
  type: "Experimental Web Redesign"
  description: "Autonomous Design System V2의 Foundation Grammar / Expressive Direction / Self-QA 루프를 검증하는 실험 프로젝트."

portfolio:
