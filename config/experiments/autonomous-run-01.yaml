goals:
  - "8개 분관에 흩어진 전시를 한 곳에서 탐색·비교하고 상세 정보를 확인하는 경험을 개선한다('지금 어디서 무엇을 볼지'를 적은 단계로 결정)"
audiences:   # 가설 — 인터뷰/행동 데이터 없음. 근거: 공개 사이트의 필터 구조(어디서/언제/누가)
  - id: weekend-visitor
    name: "주말·여가 관람을 계획하는 서울 거주 성인 관람객"
    evidence: hypothesis
    core_tasks: ["현재 전시 탐색", "분관·기간 비교", "관람 정보 확인"]
  - id: family-visitor
    name: "아이와 함께 방문하는 가족 관람객"
    evidence: hypothesis
    core_tasks: ["대상 연령에 맞는 전시 찾기", "관람 정보 확인"]
primary_user_tasks:
  - "현재 전시 탐색(분관·기간 기준)"
  - "목록에서 전시 비교"
  - "상세에서 기간·장소·관람시간·요금 확인"

