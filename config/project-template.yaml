# Project Definition Template (Schema 참고용)
# 이 저장소의 프로젝트는 config/project.yaml 하나다. 이 파일은 각 필드의 의미를 설명한다.
# 비워 둔 값을 Agent가 추정해 채우지 않는다.

project:
  id: ""              # kebab-case 식별자
  mode: ""            # figma_implementation(완성된 Figma 디자인을 코드로 구현) | autonomous_generation(Brief와 Content로 전체 생성)
  name: ""            # 사이트 이름 또는 표기할 이름
  type: ""            # 예: "personal portfolio / profile website"
  description: ""     # 한두 문장

# Design Source — mode에 따라 디자인 정의가 오는 곳
#   figma_implementation   → type: figma,     Figma(READ ONLY) → design-source/implementation-spec.md + docs/css/tokens.css
#   autonomous_generation  → type: generated, Brief → ia/ → design-system/visual-language.md(승인) + docs/css/tokens.css
design_source:
  type: ""                 # figma | generated
  access: read_only        # figma일 때 고정값
  status: NOT_CONFIRMED    # figma: NOT_CONFIRMED | CONFIRMED | CALIBRATED | PLAN_READY · generated: NOT_STARTED | PROPOSED | APPROVED
  reference:               # figma일 때만
    url: ""
    file_key: ""
    pages: []              # [{ name, node_id }]
    frames: []             # [{ page_id, viewport, name, node_id, width }]
  local_exports: ""        # 선택. Figma 도구를 쓸 수 없을 때의 대체 입력(사용자가 내보낸 이미지 폴더)
  spec: ""                 # figma: design-source/implementation-spec.md · generated: design-system/visual-language.md

# goals / audiences / primary_user_tasks: autonomous_generation에서는 필수, figma_implementation에서는 선택
goals: []
  # 사이트가 달성해야 하는 것. 예: ["채용 담당자가 2분 안에 대표 작업 3개를 본다"]

audiences: []
  # - id: "recruiter"
  #   name: ""
  #   description: ""
  #   core_tasks: []

primary_user_tasks: []
  # 방문자가 가장 먼저/자주 하는 행동. 예: ["대표 프로젝트 보기", "연락하기"]

ux_requirements: []
  # 예: ["연락 방법은 모든 Page에서 한 번의 클릭으로 접근"]

design_constraints: []
  # 예: ["본인 사진은 사용하지 않음"]

project_asset_restrictions: []
  # 이 사이트에서 쓰지 않을 이미지 유형(legal/source-policy.yaml의 공용 규칙에 추가되는 항목)

reference_preferences: []
  # 레퍼런스 조사 시 우선 참고할 방향. 비워도 Reference Research는 동작한다(Optional Stage)

site:
  stack: ["HTML5", "CSS3", "Vanilla JavaScript"]   # 변경은 Level 3
  forbidden: []             # 도입하지 않을 기술
  source_dir: docs          # 웹사이트 소스이자 배포 대상
  repository: ""            # owner/name
  deploy:
    platform: github-pages
    method: branch
    branch: main
    folder: /docs
  base_path: "/"            # Project Site면 "/<repository-name>/"
  url: ""
  pages: []                 # [{ id: index, file: index.html }] — content_ia에서 확정
  breakpoints: []           # min-width(px) — site_scaffold에서 확정. Media Query 값의 유일한 원본
  js_policy:
    progressive_enhancement: true
    files: ["js/main.js"]
    review_threshold_lines: 150
  performance_budget:
    max_transfer_kb: 1500
    max_requests: 30

viewports:                  # Browser QA 기준 폭(px). scripts/qa/capture.cjs가 이 값을 읽는다
  desktop: 1440
  tablet: 768
  mobile: 390

automation:
  autonomy_mode: autonomous     # guided(Level 2도 실행 전 확인) | autonomous
  user_approval_budget: 3       # 한 번에 묶어 묻는 Level 3 질문 최대 개수
  max_polish_passes: 3          # Page/Section당 Structural + Visual QA + Micro Fix
  state_file: automation/pipeline-state.json

# 아래 두 블록은 autonomous_generation 전용이다
visual_expression:              # auto | low | medium | high (style_bias: auto | restrained | balanced | expressive)
  style_bias: auto
  color_intensity: auto
  typography_expressiveness: auto
  composition_experimentation: auto
  imagery_dominance: auto
  artwork_intensity: auto
  motion_intensity: auto
  # auto인 항목은 Visual Director가 결정하고 design-system/visual-language.md에 근거를 남긴다

visual_direction:
  status: NOT_STARTED           # NOT_STARTED | PROPOSED | APPROVED
  name: ""

status: not_started             # not_started | in_progress | review | complete
