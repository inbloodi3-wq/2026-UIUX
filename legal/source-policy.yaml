    tier: blocked
    notes: "검색 결과 썸네일을 Asset으로 채택하지 않는다. 원본 출처를 찾았다면 그 출처 자체의 등급을 따른다."

  unknown:
    tier: blocked
    notes: "정책에 명시되지 않은 모든 도메인의 기본값. 새 출처가 필요하면 이 파일에 먼저 등록한 뒤 사용한다."

  # --- Font Source (2026-10-04 사용자 승인: Allura, Cormorant Garamond Self-host용 다운로드) ---
  # Google Fonts 공식 저장소와, 그 METADATA/upstream_info가 명시하는 공식 upstream 저장소만 허용한다.
  # Font mirror, 재배포 사이트, CDN Runtime 사용은 허용하지 않는다.
  github.com/google/fonts:
    tier: final_asset_allowed
    api_required: false
    direct_automation: true
    notes: "Google Fonts 공식 저장소. Font 파일과 OFL.txt를 받는다. 받은 뒤 OFL.txt와 Font name table로 라이선스를 확인한다."
  github.com/CatharsisFonts/Cormorant:
    tier: final_asset_allowed
    api_required: false
    direct_automation: true
    notes: "Cormorant 공식 upstream(google/fonts ofl/cormorantgaramond의 METADATA.pb source.repository_url). Static/Webfont 파일용."
  github.com/googlefonts/allura:
    tier: final_asset_allowed
    api_required: false
    direct_automation: true
    notes: "Allura 공식 upstream(google/fonts ofl/allura의 METADATA.pb source.repository_url)."

  # --- Font Source 추가 (2026-10-04 사용자 승인: Profile의 Noto Sans KR, Pretendard Self-host) ---
  github.com/orioncactus/pretendard:
    tier: final_asset_allowed
    api_required: false
    direct_automation: true
    notes: "Pretendard 공식 저장소(제작자 배포). dist/web/static의 woff2 Subset과 LICENSE를 받는다."
  fonts.googleapis.com:
    tier: final_asset_allowed
    api_required: false
    direct_automation: true
    notes: "Google Fonts 공식 배포(css2 API와 fonts.gstatic.com 파일). 필요한 글자만 담은 Subset 파일을 받아 Self-host하는 용도로만 쓴다. 사이트가 실행 중에 이 주소를 호출하게 만들지 않는다(CDN Runtime 금지)."
