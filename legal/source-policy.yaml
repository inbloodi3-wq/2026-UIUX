# Source Policy — Asset/Reference 출처 등급 (범용, 전체 Automation Core 공통)
#
# 등급:
#   final_asset_allowed — 최종 결과물에 사용할 이미지를 가져올 수 있는 출처
#   reference_only      — 디자인 분석(텍스트 관찰)에만 사용, 이미지 다운로드/삽입 금지
#   blocked             — Asset/Reference 어느 용도로도 사용하지 않음
#
# Unknown Source는 자동 승인하지 않는다 (기본값: blocked for asset use).
# 이 파일은 프로젝트에 관계없이 공통으로 적용되며, 프로젝트별 추가 제한은
# config/project.yaml의 project_asset_restrictions에 둔다.
# 함께 사용: legal/license-evidence.jsonl, .claude/rules/web-research-safety.md

fail_closed: true

sources:
  pixabay.com:
    tier: final_asset_allowed
    api_required: true
    direct_automation: true
    notes: >
      공식 API만 사용. HTML scraping 금지. 동일 검색어는 24시간 캐시를 우선 사용해
      불필요한 재조회를 피한다. Mass query/download 금지, 실제 채택한 Asset만
      로컬에 저장한다. Permanent hotlink 금지.

  unsplash.com:
    tier: final_asset_allowed
    api_required: true
    direct_automation: true
    notes: >
      공식 API만 사용. API가 반환한 이미지 URL 정책을 그대로 따른다. Attribution
      메타데이터(작가명/프로필 URL)를 유지한다. 실제 채택 시 download_location
      endpoint 호출이 필수다. Compliance 여부가 불확실한 후보는 자동 승인하지
      않고 conditional(추가 확인 필요)로 처리한다.

  pexels.com:
    tier: final_asset_allowed
    api_required: true
    direct_automation: true
    notes: >
      공식 API만 사용. Optional Provider. Attribution/Provider 메타데이터를
      유지하고 API rate limit을 관리한다.

  pinterest.com:
    tier: reference_only
    api_required: false
    direct_automation: false
    notes: "이미지 다운로드/최종 결과물 삽입 금지. 사용자 제공 URL 또는 허용된 Search Tool의 공개 URL/메타데이터만 기록."

  behance.net:
    tier: reference_only
